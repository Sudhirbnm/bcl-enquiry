<title>Factory Dashboard — Brand Concepts Limited</title>
<script>
/* Access: only after portal login, and only for users who have the Factory report */
(function(){
  var u=null;try{u=JSON.parse(sessionStorage.getItem('bcl_user')||'null');}catch(e){}
  var tools=u&&u.tools?String(u.tools).split(',').filter(Boolean):[];
  var ok=!!u&&(u.isAdmin||(tools.length?tools.indexOf('factory')>=0:
    (['Management','Buying'].indexOf(u.dept)>=0&&['L1','L2','L3'].indexOf(u.level)>=0)));
  if(!ok){document.documentElement.style.visibility='hidden';location.replace('index.html');}
})();
</script>
<script>
/* Mobile / Desktop view. Phones remember the choice; laptops follow window width. */
(function(){
  var h=document.documentElement,phone=Math.min(screen.width,screen.height)<=760,m=null;
  if(phone){h.classList.add('phone');try{m=localStorage.getItem('bcl_factory_mode');}catch(e){}if(m!=='desktop')m='mobile';}
  else m=innerWidth<=760?'mobile':'desktop';
  h.classList.toggle('mob',m==='mobile');
  if(phone&&m==='desktop')document.querySelector('meta[name=viewport]').setAttribute('content','width=1280');
})();
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f7;--s1:#ffffff;--s2:#f5f5f7;--s3:#e8e8ed;--bd:#e3e3e8;--bd2:#c7c7cc;--hair:rgba(0,0,0,.08);
  --text:#1d1d1f;--muted:#6e6e73;--dim:#a1a1a6;
  --accent:#0071e3;--green:#248a3d;--amber:#b25000;--red:#d70015;--blue:#0071e3;--purple:#8944ab;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 3px 12px rgba(0,0,0,.05)}
html{-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;min-height:100vh;letter-spacing:-.005em}
a{color:inherit;text-decoration:none}

/* top bar — translucent, like the macOS menu bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:rgba(255,255,255,.8);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:100}
.logo{min-width:0}
.logo-co{font-size:12px;font-weight:600;color:var(--muted)}
.logo-title{font-size:17px;font-weight:600;letter-spacing:-.02em}
.logo-sub{font-size:12px;color:var(--muted);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:8px}
.badge{font-size:12px;color:var(--muted);background:rgba(0,0,0,.05);padding:5px 11px;border-radius:20px;white-space:nowrap}
.badge b{color:var(--text);font-weight:500}
.btn{background:#fff;border:1px solid var(--bd2);color:var(--text);font:inherit;font-size:13px;font-weight:500;padding:6px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;box-shadow:0 .5px 1px rgba(0,0,0,.06)}
.btn:hover{background:#f5f5f7}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#0077ed}

/* view switcher — macOS segmented control */
.tabs{display:flex;justify-content:center;padding:14px 16px 4px;position:sticky;top:57px;z-index:90;background:var(--bg)}
.seg{display:inline-flex;background:#e3e3e8;border-radius:9px;padding:2px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.tab{padding:6px 16px;cursor:pointer;color:var(--text);font:inherit;font-size:13px;font-weight:500;border:none;background:none;border-radius:7px;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.55)}
.tab.active{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

/* filters */
.filter-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:10px 16px 4px;max-width:1500px;margin:0 auto}
.filter-label{display:none}
.filter-bar select,.filter-bar input{background:#fff;border:1px solid var(--bd2);color:var(--text);font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;min-width:150px;max-width:220px;outline:none}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,113,227,.15)}
.btn-clear{font-size:13px;color:var(--accent);background:none;border:none;box-shadow:none}
.btn-clear:hover{background:none;text-decoration:underline}

.main{padding:16px 20px 40px;max-width:1500px;margin:0 auto}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--s1);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi-label{font-size:12px;color:var(--muted)}
.kpi-value{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.warn .kpi-value{color:var(--red)}
.kpi.good .kpi-value{color:var(--green)}

.tbl-card{background:var(--s1);border-radius:14px;margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden;width:fit-content;max-width:100%}
.tbl-wrap{overflow:auto;max-height:70vh}
.data-tbl{width:auto;border-collapse:collapse;font-size:13px}
.data-tbl th{position:sticky;top:0;z-index:3;background:#fff;color:var(--muted);font-weight:600;font-size:12px;text-align:right;padding:10px 16px;border-bottom:1px solid var(--bd);white-space:nowrap}
.data-tbl th.l,.data-tbl td.l{text-align:left}
.data-tbl th:not(.gap),.data-tbl td:not(.gap){min-width:84px}
.data-tbl th.l:first-child{min-width:150px}
.data-tbl td{padding:8px 16px;text-align:right;border-bottom:1px solid #f0f0f3;white-space:nowrap;font-variant-numeric:tabular-nums}
.data-tbl tbody tr:hover td{background:#f8f8fa}
.data-tbl tr.tot td{font-weight:600;background:#f5f5f7;border-bottom:1px solid var(--bd)}
.data-tbl tr.grp td{font-weight:600;cursor:pointer}
.data-tbl tr.sub td.l{padding-left:34px;color:var(--muted)}
.data-tbl td.ob,.data-tbl th.ob{background:rgba(0,113,227,.05)}
.data-tbl th.ob{background:#f2f7fd}
.data-tbl td.gap,.data-tbl th.gap{width:14px;padding:0;border-bottom-color:transparent;background:transparent}
.tog{display:inline-block;width:18px;color:var(--muted);font-weight:400}
.z{color:var(--dim)}
.extra{color:var(--blue)}
.c-red{color:var(--red);font-weight:600}
.c-amber{color:var(--amber);font-weight:600}
.c-green{color:var(--green);font-weight:600}
td.c-red,td.c-amber,td.c-green{background:transparent}
.s-pend{color:var(--amber);font-weight:600}.s-done{color:var(--green);font-weight:600}.s-short{color:var(--purple);font-weight:600}

.state{padding:70px 20px;text-align:center;color:var(--muted);font-size:14px}
.spinner{width:28px;height:28px;border:3px solid var(--s3);border-top-color:var(--muted);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.state .btn{margin-top:14px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(29,29,31,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
input[type=file]{display:none}
.mtap{display:none}

/* ════ PHONE VIEW — tables become cards ════ */
/* (driven by the Mobile / Desktop switch, not screen width) */
  html.mob body{font-size:14px}
  html.mob .topbar{flex-wrap:wrap;padding:10px 14px;row-gap:8px}
  html.mob .logo{flex:1 1 100%}
  html.mob .logo-title{font-size:20px}
  html.mob .logo-sub{display:none}
  html.mob .topbar-right{flex:1 1 100%;overflow-x:auto;scrollbar-width:none}
  html.mob .topbar-right::-webkit-scrollbar{display:none}
  html.mob .btn{font-size:13px;padding:6px 11px}
  html.mob .tabs{padding:10px 12px 2px;justify-content:flex-start}
  html.mob .seg{width:100%}
  html.mob .tab{flex:1 0 auto;padding:7px 12px}
  html.mob .filter-bar{gap:8px;padding:10px 12px 2px;justify-content:stretch}
  html.mob .filter-bar select,html.mob .filter-bar input{flex:1 1 calc(50% - 8px);min-width:0;max-width:none;font-size:16px;padding:8px 10px}
  html.mob .btn-clear{flex:1 1 100%;padding:4px}
  html.mob .main{padding:12px 12px 40px}
  html.mob .kpi-grid{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  html.mob .kpi{padding:12px 13px;border-radius:12px}
  html.mob .kpi-label{font-size:11.5px;line-height:1.3}
  html.mob .kpi-value{font-size:21px}
  /* card list */
  html.mob .tbl-card{background:none;box-shadow:none;border-radius:0;overflow:visible;margin-bottom:18px;width:auto}
  html.mob .data-tbl th:not(.gap),html.mob .data-tbl td:not(.gap){min-width:0}
  html.mob .tbl-wrap{overflow:visible;max-height:none}
  html.mob .data-tbl,html.mob .data-tbl tbody,html.mob .data-tbl tr,html.mob .data-tbl td{display:block;width:100%}
  html.mob .data-tbl thead{display:none}
  html.mob .data-tbl tr{background:#fff;border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px;padding:4px 14px 6px;position:relative}
  html.mob .data-tbl tbody tr:hover td{background:none}
  html.mob .data-tbl td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;text-align:right;padding:7px 0;border-bottom:1px solid #f0f0f3;white-space:normal}
  html.mob .data-tbl td:last-child{border-bottom:none}
  html.mob .data-tbl td::before{content:attr(data-label);color:var(--muted);font-weight:400;text-align:left;flex:0 1 auto}
  html.mob .data-tbl td.mtitle{display:block;text-align:left;font-size:16px;font-weight:600;padding:10px 0 8px;letter-spacing:-.01em}
  html.mob .data-tbl td.mtitle::before{content:none}
  html.mob .data-tbl td.mhide,html.mob .data-tbl td.gap{display:none}
  html.mob .data-tbl tr.mx td.mmore{display:none}
  html.mob .data-tbl tr.mx.open td.mmore{display:flex}
  html.mob .data-tbl tr.mx{cursor:pointer}
  html.mob .mtap{display:block;font-size:13px;color:var(--accent);padding:6px 0 4px;text-align:left}
  html.mob .data-tbl tr.mx .mtap::after{content:'Show details'}
  html.mob .data-tbl tr.mx.open .mtap::after{content:'Hide details'}
  html.mob .data-tbl td.ob,html.mob .data-tbl th.ob{background:none}
  html.mob .data-tbl tr.tot{background:#fff;box-shadow:0 0 0 1px var(--bd2) inset,var(--shadow)}
  html.mob .data-tbl tr.tot td{background:none;border-bottom-color:#f0f0f3;font-weight:600}
  html.mob .data-tbl tr.grp td.mtitle{color:var(--text)}
  html.mob .data-tbl tr.sub{margin-left:14px;width:auto;box-shadow:none;border:1px solid var(--bd);background:#fbfbfd}
  html.mob .data-tbl tr.sub td.l{padding-left:0}
  html.mob .data-tbl td.empty{display:block;text-align:center}
  html.mob .data-tbl td.empty::before{content:none}
  html.mob .c-red,html.mob .c-amber,html.mob .c-green{background:none}
  html.mob .tog{width:auto;margin-right:6px}
  html.mob .toast{bottom:16px;width:calc(100% - 32px);text-align:center}

/* Mobile / Desktop switch — shown on phones only */
.modeSeg{display:none}
html.phone .modeSeg{display:inline-flex;flex:0 0 auto;width:auto}
html.phone .modeSeg .mbtn{padding:5px 12px;font:inherit;font-size:13px;font-weight:500;border:none;background:none;border-radius:7px;color:var(--text);cursor:pointer}
html.phone .modeSeg .mbtn.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
html.phone:not(.mob) .modeSeg{border-radius:18px;padding:5px}
html.phone:not(.mob) .modeSeg .mbtn{font-size:30px;padding:12px 30px;border-radius:14px}

/* Phone Production view — style-wise Last Day / MTD */
.psec{background:#fff;border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.psec-h{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 10px;border-bottom:1px solid var(--bd)}
.psec-h b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.psec-h span{font-size:12.5px;color:var(--muted)}
.psec-h span i{font-style:normal;color:var(--text);font-weight:600}
.ptbl{width:100%;border-collapse:collapse;font-size:14px}
.ptbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:9px 14px 7px;cursor:pointer;user-select:none;-webkit-user-select:none;white-space:nowrap;background:#fafafc;border-bottom:1px solid var(--bd)}
.ptbl th.l,.ptbl td.l{text-align:left}
.ptbl th.on{color:var(--accent)}
.ptbl th .ar{display:inline-block;width:10px;margin-left:2px}
.ptbl td{padding:9px 14px;text-align:right;border-bottom:1px solid #f0f0f3;font-variant-numeric:tabular-nums}
.ptbl td.l{word-break:break-word}
.ptbl tr:last-child td{border-bottom:none}

.pnote{font-size:12px;color:var(--muted);padding:0 4px 10px}

<script>
/* ───────────────── SETTINGS ───────────────── */
// Web App URL of the "Factory Relay" Google Apps Script (fetches Factory data.xlsx from Dropbox).
const FACTORY_RELAY='https://script.google.com/macros/s/AKfycbwOdvtpLCNST973ijn5BOpQDRxeMcS_fegqETm1fYJoZ0wQbDtr40nuk0js0D-Z4Hty0Q/exec';

/* ═════════════════ ENGINE (pure calculations) ═════════════════ */
/*ENGINE-START*/
const ENGINE=(function(){
  // ---- dates as Excel serial day numbers ----
  const DAY=86400000;
  function serialOf(y,m,d){return Math.round(Date.UTC(y,m,d)/DAY)+25569;}
  function ymd(s){const dt=new Date((s-25569)*DAY);return [dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate()];}
  function eom(s,k){const [y,m]=ymd(s);return serialOf(y,m+k+1,0);}
  function monthDiff(a,b){const [ya,ma]=ymd(a),[yb,mb]=ymd(b);return (ya-yb)*12+(ma-mb);}
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function monLabel(s,k){const [y,m]=ymd(eom(s,k));return MON[m]+'-'+String(y).slice(-2);}
  function fmtDate(s){if(s==null)return'';const [y,m,d]=ymd(s);return String(d).padStart(2,'0')+'-'+MON[m]+'-'+String(y).slice(-2);}
  function todaySerial(now){const d=now||new Date();return serialOf(d.getFullYear(),d.getMonth(),d.getDate());}

  // ---- cell readers ----
  function txt(v){return v==null?'':String(v).trim();}
  function num(v){if(v==null||v==='')return null;if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?null:n;}
  function dateS(v){
    if(v==null||v==='')return null;
    if(typeof v==='number')return Math.floor(v);
    if(v instanceof Date)return serialOf(v.getFullYear(),v.getMonth(),v.getDate());
    const s=String(v).trim();let m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);
    if(m){let y=+m[3];if(y<100)y+=2000;return serialOf(y,+m[2]-1,+m[1]);}
    const t=Date.parse(s);if(!isNaN(t)){const d=new Date(t);return serialOf(d.getFullYear(),d.getMonth(),d.getDate());}
    return null;
  }
  function eanTxt(v){if(v==null)return'';if(typeof v==='number')return Number.isInteger(v)?String(v):String(v);return String(v).trim();}
  function proper(s){return s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());}

  function readSheet(XLSX,wb,name,marker){
    const ws=wb.Sheets[name];if(!ws)return [];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
    const hi=aoa.findIndex(r=>r&&r.some(v=>v!=null&&String(v).trim()===marker));
    if(hi<0)return [];
    const hdr=aoa[hi].map(v=>v==null?'':String(v).trim());
    return aoa.slice(hi+1).map(r=>{const o={};hdr.forEach((h,i)=>{if(h&&!(h in o))o[h]=r[i];});return o;});
  }

  // ---- build the model from the workbook ----
  function build(XLSX,wb,today){
    const t=today;
    const bom=eom(t,-1)+1, eom0=eom(t,0), eom5=eom(t,5);

    const orders=readSheet(XLSX,wb,'Order','EAN Code').map(r=>({
      customer:txt(r['Customer Name']),ean:eanTxt(r['EAN Code']),line:txt(r['PP/PC']).toUpperCase(),
      ctype:txt(r['Customer Type']),brand:txt(r['Brand']),style:txt(r['Style']),color:txt(r['Color']),size:txt(r['Size']),
      qty:num(r['Qty']),orderNo:txt(r['Order No']),od:dateS(r['Order Date']),due:dateS(r['Committed Delivery Date (at PO)']),
      status:txt(r['Status'])?proper(txt(r['Status'])):'Open'
    })).filter(o=>o.ean!==''&&o.qty!=null).map((o,i)=>(o.ix=i+1,o));

    const production=readSheet(XLSX,wb,'Daily Production','EAN Code').map(r=>({date:dateS(r['Date']),ean:eanTxt(r['EAN Code']),qty:num(r['Production Qty'])}))
      .filter(p=>p.ean!==''&&p.qty!=null);
    const dispatch=readSheet(XLSX,wb,'Dispatch','EAN Code').map(r=>({date:dateS(r['Date']),orderNo:txt(r['Order No']),ean:eanTxt(r['EAN Code']),qty:num(r['Dispatch Qty'])}))
      .filter(d=>d.ean!==''&&d.qty!=null);
    const discussion=readSheet(XLSX,wb,'Order In Discussion','Tentative Delivery Date').map(r=>({
      customer:txt(r['Customer Name']),ctype:txt(r['Customer Type']),line:txt(r['PP/PC']).toUpperCase(),brand:txt(r['Brand']),
      style:txt(r['Style']),qty:num(r['Qty']),date:dateS(r['Tentative Delivery Date']),status:txt(r['Status'])||'In Discussion'
    })).filter(d=>d.qty!=null);
    const ctypes=[];readSheet(XLSX,wb,'Lists','Customer Type').forEach(r=>{const v=txt(r['Customer Type']);if(v&&!ctypes.includes(v))ctypes.push(v);});
    [...orders,...discussion].forEach(o=>{if(o.ctype&&!ctypes.includes(o.ctype))ctypes.push(o.ctype);});

    // product master: first order line per EAN
    const product={};
    orders.forEach(o=>{if(!product[o.ean])product[o.ean]={ean:o.ean,line:o.line,brand:o.brand,style:o.style,color:o.color,size:o.size};});

    // dispatch / production aggregates
    const add=(m,k,v)=>{m[k]=(m[k]||0)+v;};
    const dispKey={},dispKeyBefore={},dispEan={},prodEan={},lastDisp={};
    dispatch.forEach(d=>{
      const k=d.orderNo+'|'+d.ean;add(dispKey,k,d.qty);add(dispEan,d.ean,d.qty);
      if(d.date!=null&&d.date<bom)add(dispKeyBefore,k,d.qty);
      const p=product[d.ean];
      if(p&&d.date!=null){const lk=d.orderNo+'|'+p.line+'|'+p.style;if(lastDisp[lk]==null||d.date>lastDisp[lk])lastDisp[lk]=d.date;}
    });
    production.forEach(p=>add(prodEan,p.ean,p.qty));

    // order line calculations
    orders.forEach(o=>{
      const k=o.orderNo+'|'+o.ean;
      o.dispatched=dispKey[k]||0;
      o.isOpen=o.status!=='Closed';
      o.pending=o.isOpen?Math.max(0,o.qty-o.dispatched):0;
      o.daysLeft=(o.pending>0&&o.due!=null)?o.due-t:null;
      o.flag=o.dispatched>o.qty?'Excess Dispatch':!o.isOpen?(o.dispatched<o.qty?'Short Supply Closed':'Completed'):
        o.pending<=0?'Completed':o.due==null?'No Date':o.daysLeft<0?'Delayed':o.daysLeft<=15?'Due in 15 days':'On Track';
      o.shortSupply=!o.isOpen?Math.max(0,o.qty-o.dispatched):0;
      o.dispBefore=dispKeyBefore[k]||0;
      o.mob=(o.isOpen&&o.due!=null&&o.due<=eom0)?Math.max(0,o.qty-o.dispBefore):0;
      o.bucket=o.due==null?7:o.due<=eom0?0:o.due>eom5?6:monthDiff(o.due,t);
      o.fgEan=(prodEan[o.ean]||0)-(dispEan[o.ean]||0);
    });
    // Pending to Produce: FG stock per EAN shared by committed date → order date → row
    const byEan={};orders.forEach(o=>(byEan[o.ean]=byEan[o.ean]||[]).push(o));
    Object.values(byEan).forEach(list=>{
      const dated=list.filter(o=>o.due!=null).sort((a,b)=>a.due-b.due||((a.od||0)-(b.od||0))||a.ix-b.ix);
      const blank=list.filter(o=>o.due==null).sort((a,b)=>a.ix-b.ix);
      let ahead=0;
      [...dated,...blank].forEach(o=>{
        o.ptp=!o.isOpen?0:o.pending-Math.max(0,Math.min(o.pending,o.fgEan-ahead));
        if(o.isOpen)ahead+=o.pending;
      });
    });

    return {t,bom,eom0,eom5,orders,production,dispatch,discussion,ctypes,product,dispEan,prodEan,lastDisp,
      labels:{cur:monLabel(t,0),m:[0,1,2,3,4,5].map(k=>monLabel(t,k))}};
  }

  // ---- production metrics for a group ----
  function prodMetrics(M,orderSel,eanSel){
    const t=M.t;
    let prod=0,disp=0,lastDay=0,last15=0;
    M.production.forEach(p=>{if(!eanSel(p.ean))return;prod+=p.qty;
      if(p.date===t-1)lastDay+=p.qty;if(p.date!=null&&p.date>=t-15&&p.date<=t-1)last15+=p.qty;});
    M.dispatch.forEach(d=>{if(eanSel(d.ean))disp+=d.qty;});
    const ready=prod-disp;
    const rows=M.orders.filter(orderSel);
    let due45=0,latePending=0;
    rows.forEach(o=>{if(o.due==null)return;if(o.due<=t+45)due45+=o.pending;if(o.due<=t)latePending+=o.pending;});
    const remaining=due45-ready;
    const late=Math.max(0,latePending-ready);
    const arr=last15/15;
    let rrr=0;
    if(remaining>0){
      const base=Math.max(ready,latePending);
      const live=rows.filter(o=>o.due!=null&&o.pending>0);
      const dates=[...new Set(live.filter(o=>o.due>t&&o.due<=t+45).map(o=>o.due))];
      dates.forEach(d=>{const cum=live.reduce((s,o)=>s+(o.due<=d?o.pending:0),0);const r=(cum-base)/(d-t);if(r>rrr)rrr=r;});
    }
    return {prod,disp,ready,due45,latePending,remaining,late,lastDay,last15,arr,rrr};
  }

  // ---- order fulfillment rows ----
  function fulfillment(M){
    const t=M.t,g={};
    M.orders.forEach(o=>{
      const k=o.orderNo+'|'+o.style+'|'+o.line;
      let r=g[k];
      if(!r)r=g[k]={orderNo:o.orderNo,style:o.style,line:o.line,customer:o.customer,ctype:o.ctype,brand:o.brand,od:o.od,due:o.due,
        total:0,supplied:0,openBal:0,readyFG:0};
      if(o.customer&&(!r.customer||o.customer<r.customer))r.customer=o.customer;
      if(o.ctype&&(!r.ctype||o.ctype<r.ctype))r.ctype=o.ctype;
      if(o.od!=null&&(r.od==null||o.od<r.od))r.od=o.od;
      if(o.due!=null&&(r.due==null||o.due<r.due))r.due=o.due;
      r.total+=o.qty;r.supplied+=o.dispatched;r.openBal+=o.pending;r.readyFG+=o.pending-o.ptp;
    });
    const out=Object.values(g).map(r=>{
      r.lastDispatch=M.lastDisp[r.orderNo+'|'+r.line+'|'+r.style];if(r.lastDispatch===undefined)r.lastDispatch=null;
      r.grp=r.openBal>0?((r.due!=null&&t>r.due)?1:2):(r.supplied<r.total?3:4);
      r.days=r.due==null?null:r.grp<=2?t-r.due:(r.lastDispatch==null?null:r.lastDispatch-r.due);
      r.balance=Math.max(0,r.total-(r.supplied+r.readyFG));
      r.status=r.grp<=2?'Pending':r.grp===3?'Short closed':'Completed';
      r.remark=r.due==null?'No committed date':r.grp<=2?(r.days>0?'Delay, '+r.days+' days':r.days===0?'Due today':'Due in '+(-r.days)+' days')
        :(r.days==null?'Closed, nothing supplied':r.days>0?'Delay, '+r.days+' days':'On time');
      r.remarkCat=r.remark.startsWith('Delay')?'Delayed':(r.grp<=2&&r.days!=null&&r.days<=0&&r.days>=-15)?'Due within 15 days':
        r.remark.startsWith('Due in')?'Due later':r.remark==='On time'?'On time':'Other';
      r.sortKey=r.grp*100000+(r.grp===1?99999-r.days:r.grp===2?(r.due==null?99998:-r.days):(r.due==null?99999:99999-(r.due-45000)));
      return r;
    });
    out.sort((a,b)=>a.sortKey-b.sortKey||(a.orderNo<b.orderNo?-1:1));
    return out;
  }

  return {build,prodMetrics,fulfillment,fmtDate,monLabel,todaySerial,eom,monthDiff};
})();
/*ENGINE-END*/

/* ---- data loading ---- */
async function loadData(){
  if(!FACTORY_RELAY){showState('<div>The live data connection isn’t set up yet.</div><div style="margin-top:6px">Use <b>Open file…</b> to view a copy of Factory data.xlsx.</div>');return;}
  showState('<div class="spinner"></div><div>Loading factory data…</div>');
  try{
    const r=await fetch(FACTORY_RELAY+(FACTORY_RELAY.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
    const j=await r.json();
    if(j.status!=='ok'||!j.b64)throw new Error(j.message||'No data returned');
    const bin=atob(j.b64),bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    useWorkbook(XLSX.read(bytes,{type:'array'}),j.fetchedAt?new Date(j.fetchedAt):new Date());
  }catch(e){
    console.error(e);
    showState('<div>Couldn’t load the factory data.</div><div class="z" style="margin-top:6px">'+esc(e.message)+'</div><button class="btn btn-primary" onclick="loadData()">Try again</button>');
  }
}
function openFile(ev){
  const f=ev.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{try{useWorkbook(XLSX.read(new Uint8Array(e.target.result),{type:'array'}),new Date(f.lastModified||Date.now()));toast('Loaded '+f.name);}
    catch(err){showState('<div>That file couldn’t be read.</div>');}};
  rd.readAsArrayBuffer(f);ev.target.value='';
}
function useWorkbook(wb,when){
  M=ENGINE.build(XLSX,wb,ENGINE.todaySerial());
  if(!M.orders.length){showState('<div>No order lines found. Check that the file has the Order sheet with its usual headers.</div>');return;}
  FUL=ENGINE.fulfillment(M);fetchedAt=when;
  $('asOf').style.display='';
  $('asOfVal').textContent=ENGINE.fmtDate(ENGINE.todaySerial(when))+' '+String(when.getHours()).padStart(2,'0')+':'+String(when.getMinutes()).padStart(2,'0');
  $('stateBox').style.display='none';$('view').style.display='block';
  render();
}
function showState(html){$('stateBox').innerHTML=html;$('stateBox').style.display='block';$('view').style.display='none';$('filterBar').style.display='none';}

function kpis(items){return '<div class="kpi-grid">'+items.map(([l,v,c])=>`<div class="kpi ${c||''}"><div class="kpi-label">${esc(l)}</div><div class="kpi-value">${v}</div></div>`).join('')+'</div>';}

/* Phone view: each table row becomes a card. data-m="title col|hidden cols|cols behind 'Show details'" */
function mobilize(){
  document.querySelectorAll('#view .data-tbl').forEach(tb=>{
    const hd=[...tb.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    const [t,h,m]=(tb.dataset.m||'0||').split('|');const title=+t,hide=(h||'').split(',').filter(Boolean).map(Number),more=(m||'').split(',').filter(Boolean).map(Number);
    tb.querySelectorAll('tbody tr').forEach(tr=>{
      const tds=[...tr.children];if(tds.length===1)return;
      tds.forEach((td,i)=>{td.dataset.label=hd[i]||'';
        if(i===title)td.classList.add('mtitle');else if(hide.includes(i))td.classList.add('mhide');else if(more.includes(i))td.classList.add('mmore');});
      if(more.length){tr.classList.add('mx');const x=document.createElement('td');x.className='mtap';tr.appendChild(x);
        tr.addEventListener('click',()=>{if(isMob())tr.classList.toggle('open');});}
    });
  });
}

/* ---- 1. Order Book ---- */
function renderBook(){
  const f=F.book,L=M.labels;
  filterBar(sel('ctype','Customer Types',M.ctypes)+sel('brand','Brands',uniq(M.orders.map(o=>o.brand))));
  const rows=M.orders.filter(o=>(!f.ctype||o.ctype===f.ctype)&&(!f.brand||o.brand===f.brand));
  const agg=list=>{const a={mob:0,b:[0,0,0,0,0,0,0,0],tot:0};list.forEach(o=>{a.mob+=o.mob;a.b[o.bucket]+=o.pending;a.tot+=o.pending;});a.disp=a.mob-a.b[0];return a;};
  const all=agg(rows);
  const show=[1,2,3,4,5,6,7].filter(k=>all.b[k]!==0);
  const bucketHdr=k=>k<=5?L.m[k]:k===6?'Later':'Unallocated';
  let h=kpis([['Current month order book ('+L.cur+')',n0(all.mob)],['Dispatched this month',n0(all.disp),'good'],
    ['Remaining this month',n0(all.b[0])],['Total open order book',n0(all.tot)]]);

  // by customer type
  const types=f.ctype?[f.ctype]:M.ctypes;
  let t='<table class="data-tbl"><thead><tr><th class="l">Customer Type</th><th class="ob">Current Month Order Book ('+L.cur+')</th><th>'+L.m[0]+'</th>'+
    show.map(k=>'<th>'+bucketHdr(k)+'</th>').join('')+'<th>Total</th></tr></thead><tbody>';
  types.forEach(ct=>{const a=agg(rows.filter(o=>o.ctype===ct));
    t+=`<tr><td class="l">${esc(ct)}</td><td class="ob">${n0(a.mob)}</td><td>${n0(a.b[0])}</td>${show.map(k=>'<td>'+n0(a.b[k])+'</td>').join('')}<td>${n0(a.tot)}</td></tr>`;});
  t+=`<tr class="tot"><td class="l">Total</td><td class="ob">${n0(all.mob)}</td><td>${n0(all.b[0])}</td>${show.map(k=>'<td>'+n0(all.b[k])+'</td>').join('')}<td>${n0(all.tot)}</td></tr></tbody></table>`;
  h+=card(t);

  // PP/PC → style
  const cols=a=>`<td class="ob">${n0(a.mob)}</td><td>${n0(a.disp)}</td><td>${n0(a.b[0])}</td>${show.map(k=>'<td>'+n0(a.b[k])+'</td>').join('')}<td>${n0(a.tot)}</td>`;
  let s='<table class="data-tbl"><thead><tr><th class="l">PP / PC · Style</th><th class="ob">Current Month Order Book</th><th>Dispatched This Month</th><th>Remaining ('+L.cur+')</th>'+
    show.map(k=>'<th>'+bucketHdr(k)+'</th>').join('')+'<th>Total Open Order Book</th></tr></thead><tbody>';
  s+=`<tr class="tot"><td class="l">Grand Total</td>${cols(all)}</tr>`;
  uniq(rows.map(o=>o.line)).forEach(ln=>{
    const lr=rows.filter(o=>o.line===ln),open=!!OPEN.book[ln];
    s+=`<tr class="grp" onclick="toggle('book','${esc(ln)}')"><td class="l"><span class="tog">${open?'−':'+'}</span>${esc(ln)}</td>${cols(agg(lr))}</tr>`;
    if(open)uniq(lr.map(o=>o.style)).map(st=>[st,agg(lr.filter(o=>o.style===st))]).filter(([,a])=>a.mob||a.tot)
      .sort((x,y)=>y[1].tot-x[1].tot).forEach(([st,a])=>{s+=`<tr class="sub"><td class="l">${esc(st)}</td>${cols(a)}</tr>`;});
  });
  s+='</tbody></table>';
  h+=card(s);
  $('view').innerHTML=h;
}

/* ---- 2. Production ---- */
function renderProd(){
  if(isMob())return renderProdMobile();
  const f=F.prod;
  filterBar(sel('brand','Brands',uniq(M.orders.map(o=>o.brand))));
  const bOk=o=>!f.brand||o.brand===f.brand;
  const eOk=(e,fn)=>{const p=M.product[e];return !!p&&(!f.brand||p.brand===f.brand)&&fn(p);};
  const lines=['PP','PC'].concat(uniq(M.orders.map(o=>o.line)).filter(l=>l!=='PP'&&l!=='PC'));
  const lm=lines.map(ln=>[ln,ENGINE.prodMetrics(M,o=>o.line===ln&&bOk(o),e=>eOk(e,p=>p.line===ln))]);
  const tot={remaining:0,lastDay:0,last15:0,arr:0,late:0,rrr:0};
  lm.forEach(([,m])=>{tot.remaining+=Math.max(0,m.remaining);['lastDay','last15','arr','late','rrr'].forEach(k=>tot[k]+=m[k]);});
  let h=kpis([['Remaining to produce (next 45 days)',n0(tot.remaining)],['Actual run rate / day',n0(tot.arr)],
    ['Required run rate / day',n0(tot.rrr),tot.rrr>tot.arr?'warn':'good'],['Late – produce now',n0(tot.late),tot.late>0?'warn':'']]);
  const rrrC=m=>m.rrr>m.arr?'c-red':'c-green';
  const row=(lbl,m,cls,isLine,key)=>`<tr class="${cls}"${key?` onclick="toggle('prod','${esc(key)}')"`:''}><td class="l">${lbl}</td><td>${nRem(m.remaining)}</td>
    <td class="${isLine&&Math.round(m.lastDay)===0?'c-red':''}">${isLine&&Math.round(m.lastDay)===0?'0':n0(m.lastDay)}</td><td>${n0(m.last15)}</td><td>${n0(m.arr)}</td>
    <td class="${m.late>0?'c-red':''}">${n0(m.late)}</td><td class="${rrrC(m)}">${n0(m.rrr)}</td></tr>`;
  let t='<table class="data-tbl"><thead><tr><th class="l">Line · Style</th><th>Remaining (Next 45 Days)</th><th>Last Day</th><th>Last 15 Days</th><th>Actual Run Rate / Day</th><th>Late – Produce Now</th><th>Required Run Rate / Day (future committed dates)</th></tr></thead><tbody>';
  lm.forEach(([ln,m])=>{
    if(ln!=='PP'&&ln!=='PC'&&!m.prod&&!m.due45)return;
    const open=!!OPEN.prod[ln];
    t+=row(`<span class="tog">${open?'−':'+'}</span>${esc(ln)}`,m,'grp',true,ln);
    if(open){
      uniq(M.orders.filter(o=>o.line===ln&&bOk(o)).map(o=>o.style)).map(st=>[st,ENGINE.prodMetrics(M,o=>o.line===ln&&o.style===st&&bOk(o),e=>eOk(e,p=>p.line===ln&&p.style===st))])
        .filter(([,m])=>m.remaining||m.last15||m.late||m.lastDay).sort((a,b)=>b[1].remaining-a[1].remaining)
        .forEach(([st,m])=>{t+=row(esc(st),m,'sub',false);});
    }
  });
  t+=row('Total',tot,'tot',false);
  t+='</tbody></table>';
  h+=card(t);
  $('view').innerHTML=h;
}

/* ---- 2b. Production — phone: style-wise Last Day & Month till date, tap a header to sort ---- */

    h+=`<table class="ptbl"><thead><tr><th class="l${S.k==='style'?' on':''}" onclick="pSort('style')">Style<span class="ar">${ar('style')}</span></th>`+
      `<th class="${S.k==='ld'?'on':''}" onclick="pSort('ld')">Last Day<span class="ar">${ar('ld')}</span></th>`+
      `<th class="${S.k==='mtd'?'on':''}" onclick="pSort('mtd')">MTD<span class="ar">${ar('mtd')}</span></th></tr></thead><tbody>`;

    h+='</tbody></table></div>';
  });
  if(none.ld||none.mtd)h+=`<div class="pnote">Includes EANs not in the Order sheet (no style): last day ${n0(none.ld)}, MTD ${n0(none.mtd)}.</div>`;
  $('view').innerHTML=h;
}
function pSort(k){PSORT=PSORT.k===k?{k,d:-PSORT.d}:{k,d:k==='style'?1:-1};render();}

/* ---- 3. Order Fulfillment ---- */
function renderFul(){
  const f=F.ful;
  filterBar(sel('orderNo','Order Numbers',uniq(FUL.map(r=>r.orderNo)))+sel('customer','Customers',uniq(FUL.map(r=>r.customer)))+
    sel('ctype','Customer Types',M.ctypes)+sel('style','Styles',uniq(FUL.map(r=>r.style)))+
    sel('remark','Remarks',['Delayed','Due within 15 days','Due later','On time','Other'])+sel('status','Statuses',['Pending','Short closed','Completed']));
  const rows=FUL.filter(r=>(!f.orderNo||r.orderNo===f.orderNo)&&(!f.customer||r.customer===f.customer)&&(!f.ctype||r.ctype===f.ctype)&&
    (!f.style||r.style===f.style)&&(!f.remark||r.remarkCat===f.remark)&&(!f.status||r.status===f.status));
  let h=kpis([['Orders delayed',n0(rows.filter(r=>r.grp===1).length),'warn'],['Orders pending',n0(rows.filter(r=>r.grp<=2).length)],
    ['Orders completed',n0(rows.filter(r=>r.grp===4).length),'good']]);
  if(!rows.length){$('view').innerHTML=h+card('<div class="empty">No orders match these filters.</div>');return;}
  const rc=r=>r.remarkCat==='Delayed'?'c-red':r.remarkCat==='Due within 15 days'?'c-amber':r.remark==='On time'?'c-green':'';
  const sc=r=>r.status==='Pending'?'s-pend':r.status==='Completed'?'s-done':'s-short';
  let t='<table class="data-tbl" data-m="1|0,12|3,4,6,7,8,14"><thead><tr><th>#</th><th class="l">Order Number</th><th class="l">Customer Name</th><th class="l">Customer Type</th><th>Order Date</th><th class="l">Style Name</th>'+
    '<th>Total Order Qty</th><th>Supplied Qty</th><th>Ready in FG</th><th>Balance Qty</th><th class="l">Remark</th><th class="l">Status</th><th class="gap"></th><th>Committed Date</th><th>Last Dispatch Date</th></tr></thead><tbody>';
  rows.forEach((r,i)=>{t+=`<tr><td>${i+1}</td><td class="l">${esc(r.orderNo)}</td><td class="l">${esc(r.customer)}</td><td class="l">${esc(r.ctype)}</td><td>${ENGINE.fmtDate(r.od)}</td>
    <td class="l">${esc(r.style)}</td><td>${n0(r.total)}</td><td>${n0(r.supplied)}</td><td>${n0(r.readyFG)}</td><td>${n0(r.balance)}</td>
    <td class="l ${rc(r)}">${esc(r.remark)}</td><td class="l ${sc(r)}">${r.status}</td><td class="gap"></td><td>${ENGINE.fmtDate(r.due)}</td><td>${r.lastDispatch!=null?ENGINE.fmtDate(r.lastDispatch):'<span class="z">–</span>'}</td></tr>`;});
  t+='</tbody></table>';
  $('view').innerHTML=h+card(t);
}

/* ---- 4. FG Ready ---- */
function renderFG(){
  const f=F.fg;
  const prods=Object.values(M.product);
  filterBar(`<input type="search" placeholder="Search EAN" value="${esc(f.ean)}" onchange="setF('ean',this.value.trim())">`+
    sel('brand','Brands',uniq(prods.map(p=>p.brand)))+sel('style','Styles',uniq(prods.map(p=>p.style)))+
    sel('line','PP/PC',uniq(prods.map(p=>p.line)))+sel('flag','Flags',['Stock at factory','Dispatch > Production','Balanced']));
  const byLine={};let notInOrder=0;
  M.production.forEach(p=>{const pr=M.product[p.ean];if(!pr){notInOrder+=p.qty;return;}(byLine[pr.line]=byLine[pr.line]||{p:0,d:0}).p+=p.qty;});
  M.dispatch.forEach(d=>{const pr=M.product[d.ean];if(pr)(byLine[pr.line]=byLine[pr.line]||{p:0,d:0}).d+=d.qty;});
  const lines=Object.keys(byLine).sort((a,b)=>(a==='PP'?0:a==='PC'?1:2)-(b==='PP'?0:b==='PC'?1:2));
  const tp=lines.reduce((s,l)=>s+byLine[l].p,0),td=lines.reduce((s,l)=>s+byLine[l].d,0);
  const excess=M.orders.filter(o=>o.flag==='Excess Dispatch').length;
  const textEan=M.orders.filter(o=>!/^\d+$/.test(o.ean)).length;
  let h=kpis([['Total produced',n0(tp)],['Dispatched',n0(td)],['FG ready at factory',n0(tp-td),tp-td<0?'warn':'good'],
    ['Production not in Order sheet',n0(notInOrder),notInOrder?'warn':''],['Excess dispatch lines',n0(excess),excess?'warn':''],['Order lines with text EAN',n0(textEan),textEan?'warn':'']]);
  let s='<table class="data-tbl"><thead><tr><th class="l">Line</th><th>Total Produced</th><th>Dispatched</th><th>FG Ready at Factory</th></tr></thead><tbody>';
  lines.forEach(l=>{const v=byLine[l],fg=v.p-v.d;s+=`<tr><td class="l">${esc(l)}</td><td>${n0(v.p)}</td><td>${n0(v.d)}</td><td class="${fg<0?'c-red':''}">${n0(fg)}</td></tr>`;});
  s+=`<tr class="tot"><td class="l">Total</td><td>${n0(tp)}</td><td>${n0(td)}</td><td>${n0(tp-td)}</td></tr></tbody></table>`;
  h+='<div style="max-width:620px">'+card(s)+'</div>';
  const list=prods.map(p=>{const pr=M.prodEan[p.ean]||0,di=M.dispEan[p.ean]||0,fg=pr-di;
      return {...p,pr,di,fg,flag:fg>0?'Stock at factory':fg<0?'Dispatch > Production':'Balanced'};})
    .filter(r=>r.pr+r.di!==0&&(!f.ean||r.ean.includes(f.ean))&&(!f.brand||r.brand===f.brand)&&(!f.style||r.style===f.style)&&(!f.line||r.line===f.line)&&(!f.flag||r.flag===f.flag))
    .sort((a,b)=>b.fg-a.fg);
  let t='<table class="data-tbl" data-m="0||1,3,4,5,6,7"><thead><tr><th class="l">EAN</th><th class="l">Brand</th><th class="l">Style</th><th class="l">Color</th><th class="l">Size</th><th class="l">PP/PC</th><th>Total Produced</th><th>Dispatched</th><th>FG Ready at Factory</th><th class="l">Flag</th></tr></thead><tbody>';
  if(!list.length)t+='<tr><td colspan="10" class="empty">No EANs match these filters.</td></tr>';
  list.forEach(r=>{const fc=r.flag==='Dispatch > Production'?'c-red':r.flag==='Stock at factory'?'c-amber':'';
    t+=`<tr><td class="l">${esc(r.ean)}</td><td class="l">${esc(r.brand)}</td><td class="l">${esc(r.style)}</td><td class="l">${esc(r.color)}</td><td class="l">${esc(r.size)}</td><td class="l">${esc(r.line)}</td>
      <td>${n0(r.pr)}</td><td>${n0(r.di)}</td><td>${n0(r.fg)}</td><td class="l ${fc}">${r.flag}</td></tr>`;});
  t+='</tbody></table>';
  $('view').innerHTML=h+card(t);
}

/* ---- 5. Pipeline ---- */
function renderPipe(){
  const f=F.pipe,L=M.labels;
  filterBar(sel('ctype','Customer Types',M.ctypes)+sel('brand','Brands',uniq(M.discussion.map(d=>d.brand))));
  const rows=M.discussion.filter(d=>!['Converted to PO','Dropped'].includes(d.status)&&d.date!=null&&(!f.ctype||d.ctype===f.ctype)&&(!f.brand||d.brand===f.brand))
    .map(d=>({...d,b:d.date<M.bom?0:d.date>M.eom5?7:ENGINE.monthDiff(d.date,M.t)+1}));
  const agg=list=>{const b=[0,0,0,0,0,0,0,0];let tot=0;list.forEach(d=>{b[d.b]+=d.qty;tot+=d.qty;});return {b,tot};};
  const all=agg(rows);
  let h=kpis([['Total pipeline qty',n0(all.tot)],['Tentative date passed',n0(all.b[0]),all.b[0]?'warn':'']]);
  if(!rows.length){$('view').innerHTML=h+card('<div class="empty">No orders in discussion right now. They appear here once added to the Order In Discussion sheet.</div>');return;}
  const show=[0,1,2,3,4,5,6,7].filter(k=>k===1||all.b[k]!==0);
  const hdr=k=>k===0?'Date Passed':k===7?'Later':L.m[k-1];
  const tbl=(title,groups,key)=>{let t='<table class="data-tbl"><thead><tr><th class="l">'+title+'</th>'+show.map(k=>'<th>'+hdr(k)+'</th>').join('')+'<th>Total</th></tr></thead><tbody>';
    groups.forEach(g=>{const a=agg(rows.filter(d=>d[key]===g));t+=`<tr><td class="l">${esc(g)}</td>${show.map(k=>`<td class="${k===0&&a.b[0]?'c-amber':''}">${n0(a.b[k])}</td>`).join('')}<td>${n0(a.tot)}</td></tr>`;});
    return t+`<tr class="tot"><td class="l">Total</td>${show.map(k=>'<td>'+n0(all.b[k])+'</td>').join('')}<td>${n0(all.tot)}</td></tr></tbody></table>`;};
  h+=card(tbl('Customer Type',f.ctype?[f.ctype]:M.ctypes,'ctype'));
  h+=card(tbl('PP / PC',uniq(rows.map(d=>d.line)),'line'));
  $('view').innerHTML=h;
}


/* ---- AI assistant: what it sees and automatic insights ---- */
const VIEW_NAMES={book:'Order Book',prod:'Production',ful:'Order Fulfillment',fg:'FG Ready',pipe:'Pipeline',ai:'AI'};
function viewText(el,cap){
  let o=[];el.querySelectorAll('.kpi').forEach(k=>o.push(k.innerText.replace(/\s*\n\s*/g,': ')));
  el.querySelectorAll('table').forEach(t=>{o.push([...t.rows].map(r=>[...r.cells].filter(c=>!c.classList.contains('gap')&&!c.classList.contains('mtap'))
    .map(c=>c.innerText.replace(/[\n\t]+/g,' ').replace(/[↕▲▼]/g,'').trim()).join('\t')).join('\n'));});
  const s=o.join('\n');return s.length>cap?s.slice(0,cap)+'\n…(more rows not shown)':s;
}
function filtText(v){const f=F[v]||{};const a=Object.keys(f).filter(k=>f[k]).map(k=>k+'='+f[k]);return a.length?a.join(', '):'none';}
function aiContext(){
  if(!M)return 'No factory data loaded yet.';
  const real=$('view'),fb=$('filterBar'),fbH=fb.innerHTML,fbD=fb.style.display,keep=VIEW;
  const tmp=document.createElement('div');tmp.style.cssText='position:absolute;left:-99999px;top:0;width:1400px';document.body.appendChild(tmp);
  real.id='view__ai';tmp.id='view';const cap={book:8000,prod:14000,ful:30000,fg:12000,pipe:5000};let out=['Data as of '+$('asOfVal').textContent+'. Today: '+ENGINE.fmtDate(M.t)+'.',
    'User is looking at: '+VIEW_NAMES[keep]+'.'];
  try{for(const v of ['book','prod','ful','fg','pipe']){VIEW=v;({book:renderBook,prod:renderProd,ful:renderFul,fg:renderFG,pipe:renderPipe})[v]();
    out.push('## '+VIEW_NAMES[v]+' (filters: '+filtText(v)+')\n'+viewText(tmp,cap[v]));}}
  catch(e){out.push('(error reading views: '+e.message+')');}
  finally{VIEW=keep;tmp.remove();real.id='view';fb.innerHTML=fbH;fb.style.display=fbD;}
  return out.join('\n\n');
}
function aiInsights(){
  if(!M)return [];
  const fmt=v=>Math.round(v).toLocaleString('en-IN'),I=[];
  const del=FUL.filter(r=>r.grp===1),soon=FUL.filter(r=>r.remarkCat==='Due within 15 days'&&r.status==='Pending');
  if(del.length){const top=[...del].sort((a,b)=>b.balance-a.balance).slice(0,2);
    I.push({t:'warn',html:`<b>${del.length} orders delayed</b>, ${fmt(del.reduce((s,r)=>s+r.balance,0))} pcs pending. Biggest: ${top.map(r=>esc(r.style)+' ('+esc(r.ctype)+', '+fmt(r.balance)+')').join(', ')}.`});}
  if(soon.length)I.push({t:'watch',html:`<b>${soon.length} orders due within 15 days</b>, ${fmt(soon.reduce((s,r)=>s+r.balance,0))} pcs still to supply.`});
  const lines=['PP','PC'].concat(uniq(M.orders.map(o=>o.line)).filter(l=>l!=='PP'&&l!=='PC'));
  let arr=0,rrr=0,late=0;lines.forEach(ln=>{const m=ENGINE.prodMetrics(M,o=>o.line===ln,e=>{const p=M.product[e];return !!p&&p.line===ln;});arr+=m.arr;rrr+=m.rrr;late+=m.late;});
  if(rrr>arr)I.push({t:'warn',html:`Production needs <b>${fmt(rrr)}/day</b> to meet committed dates; actual run rate is ${fmt(arr)}/day (short by ${fmt(rrr-arr)}/day).`});
  else if(rrr>0)I.push({t:'good',html:`Run rate ${fmt(arr)}/day covers the ${fmt(rrr)}/day needed for future committed dates.`});
  if(late>0){const st=uniq(M.orders.map(o=>o.style)).map(s=>[s,ENGINE.prodMetrics(M,o=>o.style===s,e=>{const p=M.product[e];return !!p&&p.style===s;}).late]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
    I.push({t:'warn',html:`<b>${fmt(late)} pcs late</b> — produce now. Most: ${st.map(x=>esc(x[0])+' '+fmt(x[1])).join(', ')}.`});}
  const ready=FUL.filter(r=>r.readyFG>0&&r.balance>0&&r.status==='Pending');
  if(ready.length)I.push({t:'info',html:`<b>${fmt(ready.reduce((s,r)=>s+Math.min(r.readyFG,r.balance),0))} pcs ready in FG</b> against ${ready.length} pending orders — can be dispatched.`});
  const cm=M.orders.reduce((a,o)=>{a.mob+=o.mob;if(o.bucket===0)a.rem+=o.pending;return a;},{mob:0,rem:0});
  if(cm.mob>0){const pct=Math.round((cm.mob-cm.rem)/cm.mob*100);I.push({t:pct>=60?'good':'watch',html:`This month: <b>${pct}% dispatched</b> (${fmt(cm.mob-cm.rem)} of ${fmt(cm.mob)}); ${fmt(cm.rem)} pcs remaining.`});}
  const ex=M.orders.filter(o=>o.flag==='Excess Dispatch').length,tx=M.orders.filter(o=>!/^\d+$/.test(o.ean)).length;
  if(ex||tx)I.push({t:'watch',html:`Data check: ${ex?ex+' lines dispatched more than ordered':''}${ex&&tx?'; ':''}${tx?tx+' order lines with a text EAN':''} (see FG Ready).`});
  const pp=M.discussion.filter(d=>!['Converted to PO','Dropped'].includes(d.status)&&d.date!=null&&d.date<M.bom);
  if(pp.length)I.push({t:'watch',html:`${pp.length} orders in discussion are past their tentative date (${fmt(pp.reduce((s,d)=>s+d.qty,0))} pcs) — confirm or drop.`});
  return I;
}
if(window.BCLAI)BCLAI.register({report:'Factory Dashboard',about:(window.BCL_KNOW&&BCL_KNOW.reports.factory)||'',
  context:aiContext,insights:aiInsights,viewName:()=>VIEW==='ai'?'factory data':VIEW_NAMES[VIEW].toLowerCase()+' view',
  suggest:['Which orders are delayed and why?','Can we meet this month\'s dispatch?','Which styles need more production?','आज की स्थिति हिंदी में बताओ']});
document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===VIEW));
function stickTabs(){const tb=document.querySelector('.topbar');$('tabs').style.top=(tb?tb.offsetHeight:0)+'px';}
window.addEventListener('resize',stickTabs);
markMode();
window.addEventListener('load',()=>{stickTabs();centerTab();loadData();});
</script>
